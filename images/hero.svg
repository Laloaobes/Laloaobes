<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Eduardo Lezama Zarate — desarrollador de software</title>
  <desc id="heroDesc">Encabezado tipográfico en tonos negros y grises con el nombre Eduardo Lezama Zarate y la leyenda Desarrollador de software.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#101010"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <style>
      .glow { animation: drift 18s ease-in-out infinite; }
      .accent { transform-box: fill-box; transform-origin: left center; animation: breathe 10s ease-in-out infinite; }

      @keyframes drift {
        0%, 100% { transform: translateX(-28px); }
        50% { transform: translateX(28px); }
      }

      @keyframes breathe {
        0%, 100% { transform: scaleX(0.55); }
        50% { transform: scaleX(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .glow, .accent { animation: none; }
      }
    </style>
  </defs>

  <rect width="800" height="340" rx="16" fill="url(#bg)"/>
  <rect x="16" y="16" width="768" height="308" rx="8" fill="url(#grid)" stroke="#303030"/>
  <ellipse class="glow" cx="620" cy="70" rx="160" ry="160" fill="url(#glow)"/>

  <text x="48" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#B8B8B8">DESARROLLADOR DE SOFTWARE</text>

  <text x="48" y="163" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5" fill="#F3F3F3">Eduardo</text>
  <text x="48" y="237" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-1.5" fill="#F3F3F3">Lezama Zarate</text>

  <text x="746" y="285" text-anchor="end" font-family="monospace" font-size="28" letter-spacing="3" fill="#A8A8A8">ELZ / &lt;/&gt;</text>

  <rect class="accent" x="48" y="280" width="120" height="3" rx="1.5" fill="#B8B8B8"/>

</svg>
